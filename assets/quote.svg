<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Random dev quote"><rect width="900" height="110" rx="4.5" fill="#0d1117"/><text x="450" y="45" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">“Programs must be written for people to read.”</text><text x="450" y="80" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#FF6B00" text-anchor="middle">— Harold Abelson</text></svg>
