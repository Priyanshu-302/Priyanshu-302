name: Refresh README assets

# Place this file at .github/workflows/readme-assets.yml
# It needs .github/scripts/generate_cards.py (see generate_cards.py).
#
# The script reads your numbers from the GitHub API and draws the stats,
# streak, languages, activity-graph and quote cards itself, so nothing
# depends on rate-limited third-party servers. It also writes
# assets/stars.json for the TOTAL STARS badge.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/readme-assets.yml"
      - ".github/scripts/generate_cards.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: Priyanshu-302
        run: python3 .github/scripts/generate_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh README assets"
            git push
          fi
